<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Liga Online</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}
h1{text-align:center;}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
}

button{
    margin:3px;
    padding:5px 10px;
    cursor:pointer;
}

.team{
    background:white;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.team h3{
    cursor:pointer;
    margin:0;
}

.players{
    display:none;
    margin-top:10px;
}

.player{
    background:#e9e9e9;
    padding:5px;
    margin:5px 0;
    border-radius:5px;
}

.hidden{display:none;}
</style>
</head>
<body>

<h1>Registro de Equipos</h1>

<input type="text" id="buscador" placeholder="🔎 Buscar jugador...">

<button onclick="ordenAZ()">A → Z</button>
<button onclick="ordenZA()">Z → A</button>

<button id="btnModo">🔐 Iniciar Sesión</button>

<div id="adminPanel" class="hidden">
<button id="btnAgregarEquipo">➕ Agregar Equipo</button>
</div>

<div id="contenedorEquipos"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

var firebaseConfig = {
apiKey: "TU API KEY",
authDomain: "registro-2026-48054.firebaseapp.com",
projectId: "registro-2026-48054",
};

firebase.initializeApp(firebaseConfig);

var db = firebase.firestore();
var auth = firebase.auth();

let usuarioLogueado=false;
let equiposAbiertos={};
let filtroJugador="";
let orden="asc";

document.getElementById("buscador").addEventListener("input",function(){
filtroJugador=this.value.toLowerCase();
renderizar();
});

function ordenAZ(){
orden="asc";
renderizar();
}

function ordenZA(){
orden="desc";
renderizar();
}

auth.onAuthStateChanged(function(user){

if(user){
usuarioLogueado=true;
document.getElementById("adminPanel").classList.remove("hidden");
document.getElementById("btnModo").textContent="🚪 Cerrar Sesión";
}else{
usuarioLogueado=false;
document.getElementById("adminPanel").classList.add("hidden");
document.getElementById("btnModo").textContent="🔐 Iniciar Sesión";
}

});

document.getElementById("btnModo").addEventListener("click",function(){

if(usuarioLogueado){
auth.signOut();
return;
}

let email=prompt("Correo:");
let password=prompt("Contraseña:");

auth.signInWithEmailAndPassword(email,password)
.then(()=>alert("Sesión iniciada"))
.catch(()=>alert("Error en credenciales"));

});

document.getElementById("btnAgregarEquipo").addEventListener("click",function(){

if(!usuarioLogueado)return;

let nombre=prompt("Nombre del equipo:");

if(nombre){
db.collection("equipos").add({nombre:nombre});
}

});

function agregarJugador(idEquipo){

if(!usuarioLogueado)return;

let nombre=prompt("Nombre del jugador:");
let folio=prompt("Folio:");

if(nombre && folio){

db.collection("equipos")
.doc(idEquipo)
.collection("jugadores")
.add({
nombre:nombre,
folio:folio,
partidos:0
});

}

}

function toggleJugadores(id){
equiposAbiertos[id]=!equiposAbiertos[id];
renderizar();
}

function renderizar(){

let contenedor=document.getElementById("contenedorEquipos");

db.collection("equipos").onSnapshot(snapshot=>{

contenedor.innerHTML="";

snapshot.forEach(doc=>{

let idEquipo=doc.id;
let equipo=doc.data();

let divEquipo=document.createElement("div");
divEquipo.className="team";

let titulo=document.createElement("h3");
titulo.textContent=equipo.nombre;
titulo.onclick=()=>toggleJugadores(idEquipo);

divEquipo.appendChild(titulo);

if(usuarioLogueado){

let btnAdd=document.createElement("button");
btnAdd.textContent="➕ Agregar Jugador";
btnAdd.onclick=()=>agregarJugador(idEquipo);

divEquipo.appendChild(btnAdd);

}

let divJugadores=document.createElement("div");
divJugadores.className="players";

if(equiposAbiertos[idEquipo]){
divJugadores.style.display="block";
}

db.collection("equipos")
.doc(idEquipo)
.collection("jugadores")
.orderBy("nombre",orden)
.onSnapshot(jugSnapshot=>{

divJugadores.innerHTML="";

jugSnapshot.forEach(jugDoc=>{

let jugador=jugDoc.data();

if(filtroJugador && !jugador.nombre.toLowerCase().includes(filtroJugador)){
return;
}

let divJugador=document.createElement("div");
divJugador.className="player";

divJugador.innerHTML=`
<strong>${jugador.nombre}</strong>
| Folio: ${jugador.folio}
| Partidos: ${jugador.partidos}
`;

divJugadores.appendChild(divJugador);

});

});

divEquipo.appendChild(divJugadores);
contenedor.appendChild(divEquipo);

});

});

}

renderizar();

</script>

</body>
</html>
