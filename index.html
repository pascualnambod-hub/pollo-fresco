<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Liga Online</title>

<style>

body{
    font-family: Arial;
    background:#f4f4f4;
    margin:0;
    padding:20px;
    padding-top:100px;
}

h1{
    text-align:center;
}

.barraBuscador{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#ffffff;
    padding:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    z-index:1000;
}

.barraBuscador input{
    width:60%;
    padding:10px;
    font-size:16px;
}

.barraBuscador button{
    padding:8px 12px;
    margin-left:5px;
    cursor:pointer;
}

button{
    margin:3px;
    padding:5px 10px;
    cursor:pointer;
}

.team{
    background:white;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.team h3{
    cursor:pointer;
    margin:0;
}

.players{
    display:none;
    margin-top:10px;
}

.player{
    background:#e9e9e9;
    padding:5px;
    margin:5px 0;
    border-radius:5px;
}

.hidden{
display:none;
}

</style>
</head>

<body>

<div class="barraBuscador">

<input type="text" id="buscador" placeholder="🔎 Buscar jugador...">

<button onclick="ordenAZ()">A → Z</button>
<button onclick="ordenZA()">Z → A</button>

<button id="btnModo">🔐 Iniciar Sesión</button>

<span id="adminPanel" class="hidden">

<button id="btnAgregarEquipo">➕ Agregar Equipo</button>

<button onclick="exportarExcel()">
📥 Exportar Excel
</button>

</span>

</div>

<h1>Registro de Equipos</h1>

<div id="contenedorEquipos"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>

var firebaseConfig = {
apiKey: "AIzaSyC22q1zGNhakkDDCRRbgbtRalEdbkJjDdA",
authDomain: "registro-2026-48054.firebaseapp.com",
projectId: "registro-2026-48054",
storageBucket: "registro-2026-48054.firebasestorage.app",
messagingSenderId: "615636276338",
appId: "1:615636276338:web:ce0386171a3766388bdeeb"
};

firebase.initializeApp(firebaseConfig);

var db = firebase.firestore();
var auth = firebase.auth();

let usuarioLogueado=false;
let equiposAbiertos={};
let filtroJugador="";
let orden="asc";

document.getElementById("buscador").addEventListener("input",function(){
filtroJugador=this.value.toLowerCase();
renderizar();
});

function ordenAZ(){
orden="asc";
renderizar();
}

function ordenZA(){
orden="desc";
renderizar();
}

auth.onAuthStateChanged(function(user){

if(user){
usuarioLogueado=true;
document.getElementById("adminPanel").classList.remove("hidden");
document.getElementById("btnModo").textContent="🚪 Cerrar Sesión";
}else{
usuarioLogueado=false;
document.getElementById("adminPanel").classList.add("hidden");
document.getElementById("btnModo").textContent="🔐 Iniciar Sesión";
}

});

document.getElementById("btnModo").addEventListener("click",function(){

if(usuarioLogueado){
auth.signOut();
return;
}

let email=prompt("Correo:");
let password=prompt("Contraseña:");

auth.signInWithEmailAndPassword(email,password)
.then(()=>alert("Sesión iniciada"))
.catch(()=>alert("Error en credenciales"));

});

document.getElementById("btnAgregarEquipo").addEventListener("click",function(){

if(!usuarioLogueado)return;

let nombre=prompt("Nombre del equipo:");

if(nombre){
db.collection("equipos").add({nombre:nombre});
}

});

function agregarJugador(idEquipo){

if(!usuarioLogueado)return;

let nombre=prompt("Nombre del jugador:");
let folio=prompt("Folio:");

if(nombre && folio){

db.collection("equipos")
.doc(idEquipo)
.collection("jugadores")
.add({
nombre:nombre,
folio:folio,
partidos:0
});

}

}

function cambiarPartidos(idEquipo,idJugador,cambio){

if(!usuarioLogueado)return;

let ref=db.collection("equipos")
.doc(idEquipo)
.collection("jugadores")
.doc(idJugador);

ref.get().then(doc=>{

let nuevo=doc.data().partidos + cambio;

if(nuevo<0)nuevo=0;

ref.update({partidos:nuevo});

});

}

function eliminarJugador(idEquipo,idJugador){

if(!usuarioLogueado)return;

if(confirm("¿Eliminar jugador?")){

db.collection("equipos")
.doc(idEquipo)
.collection("jugadores")
.doc(idJugador)
.delete();

}

}

function eliminarEquipo(idEquipo){

if(!usuarioLogueado)return;

if(confirm("¿Eliminar equipo?")){
db.collection("equipos").doc(idEquipo).delete();
}

}

function toggleJugadores(id){
equiposAbiertos[id]=!equiposAbiertos[id];
renderizar();
}

function renderizar(){

let contenedor=document.getElementById("contenedorEquipos");

db.collection("equipos").onSnapshot(snapshot=>{

contenedor.innerHTML="";

snapshot.forEach(doc=>{

let idEquipo=doc.id;
let equipo=doc.data();

let divEquipo=document.createElement("div");
divEquipo.className="team";

let titulo=document.createElement("h3");
titulo.textContent=equipo.nombre;
titulo.onclick=()=>toggleJugadores(idEquipo);

divEquipo.appendChild(titulo);

if(usuarioLogueado){

let btnAdd=document.createElement("button");
btnAdd.textContent="➕ Agregar Jugador";
btnAdd.onclick=()=>agregarJugador(idEquipo);

divEquipo.appendChild(btnAdd);

let btnDel=document.createElement("button");
btnDel.textContent="🗑 Eliminar Equipo";
btnDel.onclick=()=>eliminarEquipo(idEquipo);

divEquipo.appendChild(btnDel);

}

let divJugadores=document.createElement("div");
divJugadores.className="players";

if(equiposAbiertos[idEquipo]){
divJugadores.style.display="block";
}

db.collection("equipos")
.doc(idEquipo)
.collection("jugadores")
.orderBy("nombre",orden)
.onSnapshot(jugSnapshot=>{

divJugadores.innerHTML="";

jugSnapshot.forEach(jugDoc=>{

let jugador=jugDoc.data();
let idJugador=jugDoc.id;

if(filtroJugador && !jugador.nombre.toLowerCase().includes(filtroJugador)){
return;
}

let divJugador=document.createElement("div");
divJugador.className="player";

divJugador.innerHTML=`
<strong>${jugador.nombre}</strong> |
Folio: ${jugador.folio} |
Partidos: ${jugador.partidos}
`;

if(usuarioLogueado){

let mas=document.createElement("button");
mas.textContent="⬆";
mas.onclick=()=>cambiarPartidos(idEquipo,idJugador,1);

let menos=document.createElement("button");
menos.textContent="⬇";
menos.onclick=()=>cambiarPartidos(idEquipo,idJugador,-1);

let eliminar=document.createElement("button");
eliminar.textContent="❌";
eliminar.onclick=()=>eliminarJugador(idEquipo,idJugador);

divJugador.appendChild(mas);
divJugador.appendChild(menos);
divJugador.appendChild(eliminar);

}

divJugadores.appendChild(divJugador);

});

});

divEquipo.appendChild(divJugadores);
contenedor.appendChild(divEquipo);

});

});

}
async function exportarExcel(){

let datos=[];

const equipos=await db.collection("equipos").get();

for(const equipoDoc of equipos.docs){

    const nombreEquipo=equipoDoc.data().nombre;

    const jugadores=await db.collection("equipos")
    .doc(equipoDoc.id)
    .collection("jugadores")
    .orderBy("nombre")
    .get();

    jugadores.forEach(jugador=>{

        const j=jugador.data();

        datos.push({

            Equipo:nombreEquipo,

            Jugador:j.nombre,

            Folio:j.folio,

            Partidos:j.partidos

        });

    });

}

if(datos.length==0){
    alert("No existen jugadores registrados.");
    return;
}

const hoja=XLSX.utils.json_to_sheet(datos);

const libro=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(libro,hoja,"Jugadores");

XLSX.writeFile(libro,"Registro_Jugadores.xlsx");

}
renderizar();

</script>

</body>
</html>
