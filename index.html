<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Oficial de Liga</title>
<style>
body{font-family:Arial, sans-serif;background:#f2f4f8;margin:0;padding:20px}
h1{text-align:center}
.container{max-width:1000px;margin:auto}
button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;margin:4px 0}
.btn-main{background:#2563eb;color:white}
.btn-edit{background:#16a34a;color:white}
.btn-delete{background:#dc2626;color:white}
.team{background:white;padding:12px;margin-bottom:15px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
.team-header{font-weight:bold;font-size:18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.players{display:none;margin-top:10px}
.player{background:#e2e8f0;padding:6px;margin-bottom:5px;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
input{padding:6px;margin:3px 0}
.admin-panel{display:none;background:white;padding:10px;border-radius:10px;margin-bottom:15px}
</style>
</head>
<body>

<div class="container">
<h1>Sistema de Equipos y Jugadores</h1>

<button class="btn-edit" onclick="activarModoEdicion()">Agregar / Editar</button>

<div id="adminPanel" class="admin-panel">
<h3>Agregar Equipo</h3>
<input type="text" id="nuevoEquipo" placeholder="Nombre del equipo">
<button class="btn-main" onclick="agregarEquipo()">Guardar Equipo</button>
<hr>
</div>

<div id="listaEquipos"></div>
</div>

<script>
const PASSWORD = "1872";
let modoEdicion = false;
let equipos = JSON.parse(localStorage.getItem("equipos")) || [];

function guardarDatos(){
localStorage.setItem("equipos", JSON.stringify(equipos));
}

function activarModoEdicion(){
let pw = prompt("Ingrese contraseña:");
if(pw === PASSWORD){
modoEdicion = true;
document.getElementById("adminPanel").style.display = "block";
alert("Modo edición activado");
render();
}else if(pw !== null){
alert("Contraseña incorrecta");
}
}

function agregarEquipo(){
if(!modoEdicion) return;
let nombre = document.getElementById("nuevoEquipo").value.trim();
if(nombre === "") return;
equipos.push({nombre:nombre,jugadores:[]});
document.getElementById("nuevoEquipo").value="";
guardarDatos();
render();
}

function eliminarEquipo(index){
if(!modoEdicion) return;
if(confirm("¿Eliminar equipo completo?")){
equipos.splice(index,1);
guardarDatos();
render();
}
}

function agregarJugador(index){
if(!modoEdicion) return;
let nombre = document.getElementById("jugadorNombre-"+index).value.trim();
let folio = document.getElementById("jugadorFolio-"+index).value.trim();
if(nombre==="" || folio==="") return;
equipos[index].jugadores.push({nombre:nombre,folio:folio});
guardarDatos();
render();
}

function eliminarJugador(teamIndex,playerIndex){
if(!modoEdicion) return;
if(confirm("¿Eliminar jugador?")){
equipos[teamIndex].jugadores.splice(playerIndex,1);
guardarDatos();
render();
}
}

function toggleJugadores(index){
let div = document.getElementById("players-"+index);
div.style.display = div.style.display === "none" ? "block" : "none";
}

function render(){
let cont = document.getElementById("listaEquipos");
cont.innerHTML="";

if(equipos.length===0){
cont.innerHTML="<p>No hay equipos registrados.</p>";
return;
}

equipos.forEach((equipo,index)=>{
let div = document.createElement("div");
div.className="team";

div.innerHTML=`
<div class="team-header" onclick="toggleJugadores(${index})">
<span>${equipo.nombre}</span>
${modoEdicion?`<button class="btn-delete" onclick="event.stopPropagation(); eliminarEquipo(${index})">Eliminar</button>`:""}
</div>
<div class="players" id="players-${index}" style="display:none">
${equipo.jugadores.length===0?"<p>Sin jugadores registrados</p>":""}
${equipo.jugadores.map((j,i)=>`
<div class="player">
<span>${j.nombre}</span>
<div>
<strong>Folio: ${j.folio}</strong>
${modoEdicion?`<button class="btn-delete" onclick="eliminarJugador(${index},${i})">X</button>`:""}
</div>
</div>
`).join("")}
${modoEdicion?`
<hr>
<input type="text" id="jugadorNombre-${index}" placeholder="Nombre jugador">
<input type="text" id="jugadorFolio-${index}" placeholder="Folio">
<br>
<button class="btn-main" onclick="agregarJugador(${index})">Guardar Jugador</button>
`:""}
</div>
`;

cont.appendChild(div);
});
}

render();
</script>

</body>
</html>
