<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Liga Online</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}
h1{text-align:center;}
button{
    margin:3px;
    padding:5px 10px;
    cursor:pointer;
}
.team{
    background:white;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}
.team h3{
    cursor:pointer;
    margin:0;
}
.players{
    display:none;
    margin-top:10px;
}
.player{
    background:#e9e9e9;
    padding:5px;
    margin:5px 0;
    border-radius:5px;
}
.hidden{display:none;}
.counter-btn{
    padding:2px 6px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Registro de Equipos</h1>

<button id="btnModo">🔐 Activar Modo Edición</button>
<div id="adminPanel" class="hidden">
    <button id="btnAgregarEquipo">➕ Agregar Equipo</button>
</div>

<div id="contenedorEquipos"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

// CONFIGURACIÓN
var firebaseConfig = {
  apiKey: "AIzaSyAFZ46skmywaoLC0W1Nj4KwXAbaLLRGP30",
  authDomain: "registro-2026-48054.firebaseapp.com",
  projectId: "registro-2026-48054",
  storageBucket: "registro-2026-48054.firebasestorage.app",
  messagingSenderId: "615636276338",
  appId: "1:615636276338:web:ce0386171a3766388bdeeb"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

let modoEdicion = false;
let equiposAbiertos = {};

document.getElementById("btnModo").addEventListener("click", function(){
    let pass = prompt("Ingrese contraseña:");
    if(pass === "1872"){
        modoEdicion = true;
        document.getElementById("adminPanel").classList.remove("hidden");
        alert("Modo edición activado");
    }else{
        alert("Contraseña incorrecta");
    }
});

document.getElementById("btnAgregarEquipo").addEventListener("click", function(){
    let nombre = prompt("Nombre del equipo:");
    if(nombre){
        db.collection("equipos").add({
            nombre: nombre
        });
    }
});

function agregarJugador(idEquipo){
    let nombre = prompt("Nombre del jugador:");
    let folio = prompt("Folio:");
    if(nombre && folio){
        db.collection("equipos").doc(idEquipo).collection("jugadores").add({
            nombre:nombre,
            folio:folio,
            partidos:0
        });
    }
}

function cambiarPartidos(idEquipo,idJugador,cambio){
    if(!modoEdicion) return;
    let ref = db.collection("equipos").doc(idEquipo).collection("jugadores").doc(idJugador);
    ref.get().then(doc=>{
        let nuevo = doc.data().partidos + cambio;
        if(nuevo < 0) nuevo = 0;
        ref.update({partidos:nuevo});
    });
}

function eliminarJugador(idEquipo,idJugador){
    if(confirm("¿Eliminar jugador?")){
        db.collection("equipos").doc(idEquipo).collection("jugadores").doc(idJugador).delete();
    }
}

function eliminarEquipo(idEquipo){
    if(confirm("¿Eliminar equipo?")){
        db.collection("equipos").doc(idEquipo).delete();
    }
}

function toggleJugadores(id){
    equiposAbiertos[id] = !equiposAbiertos[id];
    renderizar();
}

function renderizar(){
    let contenedor = document.getElementById("contenedorEquipos");
    contenedor.innerHTML = "";

    db.collection("equipos").onSnapshot(snapshot=>{
        contenedor.innerHTML = "";
        snapshot.forEach(doc=>{
            let idEquipo = doc.id;
            let equipo = doc.data();

            let divEquipo = document.createElement("div");
            divEquipo.className="team";

            let titulo = document.createElement("h3");
            titulo.textContent = equipo.nombre;
            titulo.onclick = ()=>toggleJugadores(idEquipo);
            divEquipo.appendChild(titulo);

            if(modoEdicion){
                let btnAdd = document.createElement("button");
                btnAdd.textContent="➕ Agregar Jugador";
                btnAdd.onclick=()=>agregarJugador(idEquipo);
                divEquipo.appendChild(btnAdd);

                let btnDel = document.createElement("button");
                btnDel.textContent="🗑 Eliminar Equipo";
                btnDel.onclick=()=>eliminarEquipo(idEquipo);
                divEquipo.appendChild(btnDel);
            }

            let divJugadores=document.createElement("div");
            divJugadores.className="players";
            if(equiposAbiertos[idEquipo]){
                divJugadores.style.display="block";
            }

            db.collection("equipos").doc(idEquipo).collection("jugadores")
            .onSnapshot(jugSnapshot=>{
                divJugadores.innerHTML="";
                jugSnapshot.forEach(jugDoc=>{
                    let jugador=jugDoc.data();
                    let idJugador=jugDoc.id;

                    let divJugador=document.createElement("div");
                    divJugador.className="player";
                    divJugador.innerHTML=`
                        <strong>${jugador.nombre}</strong> |
                        Folio: ${jugador.folio} |
                        Partidos: ${jugador.partidos}
                    `;

                    if(modoEdicion){
                        let mas=document.createElement("button");
                        mas.textContent="⬆";
                        mas.onclick=()=>cambiarPartidos(idEquipo,idJugador,1);

                        let menos=document.createElement("button");
                        menos.textContent="⬇";
                        menos.onclick=()=>cambiarPartidos(idEquipo,idJugador,-1);

                        let eliminar=document.createElement("button");
                        eliminar.textContent="❌";
                        eliminar.onclick=()=>eliminarJugador(idEquipo,idJugador);

                        divJugador.appendChild(mas);
                        divJugador.appendChild(menos);
                        divJugador.appendChild(eliminar);
                    }

                    divJugadores.appendChild(divJugador);
                });
            });

            divEquipo.appendChild(divJugadores);
            contenedor.appendChild(divEquipo);
        });
    });
}

renderizar();

</script>

</body>
</html>
