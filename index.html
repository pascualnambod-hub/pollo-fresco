<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Liga</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}
h1{text-align:center;}
button{
    margin:3px;
    padding:5px 10px;
    cursor:pointer;
}
.team{
    background:white;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}
.team h3{
    cursor:pointer;
    margin:0;
}
.players{
    display:none;
    margin-top:10px;
}
.player{
    background:#e9e9e9;
    padding:5px;
    margin:5px 0;
    border-radius:5px;
}
.hidden{display:none;}
.counter-btn{
    padding:2px 6px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Registro de Equipos</h1>

<button id="btnModo">🔐 Activar Modo Edición</button>
<div id="adminPanel" class="hidden">
    <button id="btnAgregarEquipo">➕ Agregar Equipo</button>
</div>

<div id="contenedorEquipos"></div>

<script>

let modoEdicion = false;
let equipos = JSON.parse(localStorage.getItem("equipos")) || [];
let equiposAbiertos = {}; // GUARDA QUÉ EQUIPOS ESTÁN ABIERTOS

function guardarDatos(){
    localStorage.setItem("equipos", JSON.stringify(equipos));
}

document.getElementById("btnModo").addEventListener("click", function(){
    let pass = prompt("Ingrese contraseña:");
    if(pass === "1872"){
        modoEdicion = true;
        document.getElementById("adminPanel").classList.remove("hidden");
        alert("Modo edición activado");
        renderizar();
    }else{
        alert("Contraseña incorrecta");
    }
});

document.getElementById("btnAgregarEquipo").addEventListener("click", function(){
    let nombre = prompt("Nombre del equipo:");
    if(nombre){
        equipos.push({nombre:nombre, jugadores:[]});
        guardarDatos();
        renderizar();
    }
});

function eliminarEquipo(index){
    if(confirm("¿Eliminar equipo?")){
        delete equiposAbiertos[index];
        equipos.splice(index,1);
        guardarDatos();
        renderizar();
    }
}

function agregarJugador(indexEquipo){
    let nombre = prompt("Nombre del jugador:");
    let folio = prompt("Folio del jugador:");
    if(nombre && folio){
        equipos[indexEquipo].jugadores.push({
            nombre:nombre,
            folio:folio,
            partidos:0
        });
        guardarDatos();
        renderizar();
    }
}

function eliminarJugador(iEquipo, iJugador){
    if(confirm("¿Eliminar jugador?")){
        equipos[iEquipo].jugadores.splice(iJugador,1);
        guardarDatos();
        renderizar();
    }
}

function cambiarPartidos(iEquipo, iJugador, cambio){
    if(!modoEdicion) return;
    let jugador = equipos[iEquipo].jugadores[iJugador];
    jugador.partidos += cambio;
    if(jugador.partidos < 0) jugador.partidos = 0;
    guardarDatos();
    renderizar();
}

function toggleJugadores(index){
    equiposAbiertos[index] = !equiposAbiertos[index];
    renderizar();
}

function renderizar(){
    let contenedor = document.getElementById("contenedorEquipos");
    contenedor.innerHTML = "";

    equipos.forEach((equipo, i) => {

        let divEquipo = document.createElement("div");
        divEquipo.className = "team";

        let titulo = document.createElement("h3");
        titulo.textContent = equipo.nombre;
        titulo.onclick = () => toggleJugadores(i);
        divEquipo.appendChild(titulo);

        if(modoEdicion){
            let btnAgregarJugador = document.createElement("button");
            btnAgregarJugador.textContent = "➕ Agregar Jugador";
            btnAgregarJugador.onclick = () => agregarJugador(i);
            divEquipo.appendChild(btnAgregarJugador);

            let btnEliminarEquipo = document.createElement("button");
            btnEliminarEquipo.textContent = "🗑 Eliminar Equipo";
            btnEliminarEquipo.onclick = () => eliminarEquipo(i);
            divEquipo.appendChild(btnEliminarEquipo);
        }

        let divJugadores = document.createElement("div");
        divJugadores.className = "players";

        if(equiposAbiertos[i]){
            divJugadores.style.display = "block";
        }

        equipo.jugadores.forEach((jugador, j) => {

            let divJugador = document.createElement("div");
            divJugador.className = "player";

            divJugador.innerHTML = `
                <strong>${jugador.nombre}</strong> |
                Folio: ${jugador.folio} |
                Partidos: ${jugador.partidos}
            `;

            if(modoEdicion){
                let btnMas = document.createElement("button");
                btnMas.textContent = "⬆";
                btnMas.className = "counter-btn";
                btnMas.onclick = () => cambiarPartidos(i,j,1);

                let btnMenos = document.createElement("button");
                btnMenos.textContent = "⬇";
                btnMenos.className = "counter-btn";
                btnMenos.onclick = () => cambiarPartidos(i,j,-1);

                let btnEliminar = document.createElement("button");
                btnEliminar.textContent = "❌";
                btnEliminar.onclick = () => eliminarJugador(i,j);

                divJugador.appendChild(btnMas);
                divJugador.appendChild(btnMenos);
                divJugador.appendChild(btnEliminar);
            }

            divJugadores.appendChild(divJugador);
        });

        divEquipo.appendChild(divJugadores);
        contenedor.appendChild(divEquipo);
    });
}

renderizar();

</script>
</body>
</html>
