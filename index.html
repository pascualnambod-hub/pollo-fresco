<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AVICOLA EL PEDREGAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff8ee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      color: #d35400;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
    }

    button {
      background: #d35400;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #b84300;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }

   li {
  background: #fef5e7;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}

.item-texto {
  flex: 1; /* 👉 hace que el texto ocupe todo el espacio */
  text-align: left;
}

    .total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
    }

    .eliminar {
  background: #e74c3c;
  color: white;
  border: none;
  border-radius: 4px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}
  </style>
</head>
<body>

<div class="container">
  <h1>🐔 AVICOLA EL PEDREGAL</h1>

  <label>CONCEPTO</label>
  <select id="parte">
    <option value="">Selecciona</option>
    <option value="80">Pollo entero</option>
    <option value="95">Surtido</option>
    <option value="85">Alas</option>
    <option value="100">Pierna y muslo</option>
    <option value="135">Pechuga</option>
    <option value="35">Retazo</option>
    <option value="15">Menudencias</option>
  </select>

  <label>Kilogramos</label>
  <input type="number" id="kg" min="0.1" step="0.1" placeholder="Ej. 2.5">

  <button onclick="agregar()">➕ Agregar al pedido</button>

  <ul id="lista"></ul>

  <div class="total">
    Total general: $<span id="total">0.00</span>
  </div>
</div>

<script>
  let totalGeneral = 0;

  function agregar() {
    const select = document.getElementById("parte");
    const kg = parseFloat(document.getElementById("kg").value);
    const precioKg = parseFloat(select.value);
    const nombre = select.options[select.selectedIndex].text;

    if (!precioKg || !kg || kg <= 0) {
      alert("Selecciona un producto y cantidad válida");
      return;
    }

    const subtotal = precioKg * kg;
    totalGeneral += subtotal;

    const li = document.createElement("li");
    li.innerHTML = `
      ${nombre} (${kg} kg) - $${subtotal.toFixed(2)}
      <button class="eliminar" onclick="eliminar(this, ${subtotal})">X</button>
    `;

    document.getElementById("lista").appendChild(li);
    document.getElementById("total").innerText = totalGeneral.toFixed(2);

    document.getElementById("kg").value = "";
    select.value = "";
  }

  function eliminar(btn, subtotal) {
    totalGeneral -= subtotal;
    btn.parentElement.remove();
    document.getElementById("total").innerText = totalGeneral.toFixed(2);
  }
</script>

</body>
</html>
